name: Docs building

# This tree is frozen, so there is no weekly cron here (unlike Ansel's copy):
# the docs only need rebuilding when the Doxygen configuration itself changes.
on:
  push:
    branches:
      - master
    paths:
      - 'doc/Doxyfile'
      - 'doc/header.html'
      - 'doc/footer.html'
      - 'doc/custom.css'
      - 'doc/doxygen-math-filter.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # Measured on this tree: the Ansel-parity config (CALL_GRAPH/CALLER_GRAPH = NO)
    # produces ~690 MB. Turning per-function call graphs on takes it to ~2.0 GB,
    # i.e. twice the 1 GB GitHub Pages limit - which is why they stay off on both
    # repositories. Do not enable them here without shrinking the graphs first.
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install deps
        run: |
          sudo apt-get -y install \
            intltool \
            doxygen \
            graphviz;
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v2
      - name: Build docs
        run: |
          doxygen doc/Doxyfile
      - name: Report generated size
        run: |
          echo "### Doxygen output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh doc/api/html >> "$GITHUB_STEP_SUMMARY"
          echo "html files : $(find doc/api/html -name '*.html' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "svg graphs : $(find doc/api/html -name '*.svg' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh doc/api/html
      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/api/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
