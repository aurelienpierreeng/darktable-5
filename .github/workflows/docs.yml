#   Doxygen API docs and code-health panel for the darktable reference tree.
#
#   Ported from the Ansel project (.github/workflows/docs.yml), so that both codebases
#   publish documentation and health metrics built with the same configuration, the same
#   tools and the same thresholds, and can be compared like for like.
#
