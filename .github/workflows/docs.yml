#   Doxygen API docs for the frozen darktable 5.0 reference tree.
#
#   Ported from the Ansel project (.github/workflows/docs.yml), so that both
#   codebases publish Doxygen sites built with the same configuration and the
#   dependency / inclusion / call graphs can be compared like for like.
