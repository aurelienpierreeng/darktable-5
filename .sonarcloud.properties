# SonarCloud automatic-analysis configuration.
#
# This tree is a frozen darktable 5.0, kept as the reference codebase the Ansel fork is
# measured against. This file is therefore kept deliberately in sync with Ansel's
# .sonarcloud.properties: the two projects are only comparable while they analyse the
# same KIND of code. Any change here should be mirrored there, and vice versa.
#
# Analysis exclusions — third-party code darktable vendors but does not author.
#
# Git submodules are upstream projects pinned at a commit: their complexity, code smells
# and bugs are not darktable's to fix, and counting them makes every project-level metric
# (notably cyclomatic complexity, which is a SUM) describe someone else's codebase.
# Excluding them here keeps the metrics about the code this repository actually controls.
#
#   src/external/rawspeed        RawSpeed          (submodule)
#   src/external/LibRaw          LibRaw            (submodule)
#   src/external/libxcf          libxcf            (submodule)
#   src/external/OpenCL          Khronos headers   (submodule)
#   src/external/whereami        whereami          (submodule)
#   src/external/lua-scripts     lua-scripts       (submodule)
#   src/tests/integration        darktable-tests   (submodule)
#   doc/doxygen-awesome-css      Doxygen theme     (submodule)
#
# src/external/ also holds vendored third-party code that is not a submodule but is equally
# third-party in origin (lua/, LuaAutoC/, LibRaw-cmake/ build glue, cie_colorimetric_tables.c,
# ThreadSafetyAnalysis.h), so the whole directory goes, exactly as on the Ansel side.
#
# Non-production languages. Nothing written in them is compiled into the application
# or runs on a user's machine: Python and shell helpers under tools/, YAML workflows,
# CMake and build glue, Markdown documentation. Analysing them reports the health of
# the toolbox rather than of the software, and the two projects keep very differently
# sized toolboxes, so counting them distorts the comparison in whichever direction the
# toolboxes happen to differ. Only C, C++ and Objective-C are measured, matching the
# allowlist in tools/code_health.py.
sonar.exclusions=src/external/**, doc/doxygen-awesome-css/**, src/tests/integration/**, \
  **/*.py, **/*.sh, **/*.bash, **/*.pl, **/*.rb, **/*.lua, \
  **/*.yml, **/*.yaml, **/*.md, **/*.xsl, **/*.xslt, \
  **/CMakeLists.txt, **/*.cmake

# Deliberately NOT ported from Ansel's copy of this file, and why. Both omissions make this
# project's numbers slightly WORSE than Ansel's rather than better, so neither flatters the
# reference tree:
#
#   sonar.cpd.exclusions=src/iop/highlights/**
#   sonar.issue.ignore.multicriteria (c:S1836 under src/iop/highlights/**)
#
# Both waive findings in Ansel's rewritten harmonic-transposition highlights module, which
# lives in per-stage modules under src/iop/highlights/ and keeps deliberate CPU/OpenCL
# mirrors by contract. darktable 5.0 has no such directory — highlights is the single file
# src/iop/highlights.c — so there is nothing here for either waiver to apply to, and adding
# an equivalent would mean inventing a waiver upstream never asked for.
#
# Consequence to keep in mind when reading duplication figures side by side: Ansel's
# duplicated-lines density excludes its highlights directory from copy-paste detection,
# and this project excludes nothing. The duplication comparison is the one metric here
# that is not strictly like for like.
#
# src/chart/ is NOT excluded. Ansel excludes its counterpart (src/apps/ansel-chart/) as dead
# code that no build target compiles; in darktable 5.0 the darktable-chart tool is still a
# live build target, so its code is genuinely part of this codebase and is analysed.
